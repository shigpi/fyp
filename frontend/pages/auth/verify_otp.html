<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceScribe - Verify Email</title>
    <meta name="description" content="Verify your VoiceScribe email address to complete registration.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #000000;
            --card:     #171717;
            --border:   #262626;
            --text:     #FFFFFF;
            --muted:    #A3A3A3;
            --subtle:   #525252;
            --input-bg: #171717;
            --btn-bg:   #FFFFFF;
            --btn-text: #000000;
            --error:    #ef4444;
            --success:  #22c55e;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .logo svg { width: 24px; height: 24px; fill: var(--text); }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
        .subtitle {
            font-size: 14px;
            color: var(--muted);
            margin: 0 0 32px;
            text-align: center;
            line-height: 1.5;
        }

        form { width: 100%; display: flex; flex-direction: column; gap: 10px; }

        .otp-inputs {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .otp-input {
            width: 52px;
            height: 60px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .otp-input:focus { border-color: var(--subtle); }

        .btn {
            width: 100%;
            padding: 16px;
            margin-top: 4px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--btn-text);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .alert {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
            text-align: center;
        }
        .alert-error   { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .alert-success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }

        .resend-row {
            margin-top: 20px;
            font-size: 14px;
            color: var(--muted);
            text-align: center;
        }

        .resend-btn {
            background: none;
            border: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            transition: color 0.2s;
        }
        .resend-btn:hover { color: var(--muted); }
        .resend-btn.disabled { color: var(--subtle); cursor: default; }

        .back-link {
            margin-top: 24px;
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </div>
        <h1>Verify Email</h1>
        <p class="subtitle" id="instructionText">We've sent a 6-digit code to your email.</p>

        <div id="errorAlert" class="alert alert-error"></div>
        <div id="successAlert" class="alert alert-success"></div>

        <form id="otpForm">
            <div class="otp-inputs">
                <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" id="otp0">
                <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" id="otp1">
                <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" id="otp2">
                <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" id="otp3">
                <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" id="otp4">
                <input type="text" class="otp-input" maxlength="1" pattern="\d*" inputmode="numeric" id="otp5">
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Verify Code</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>

        <p class="resend-row">
            Didn't receive the code?
            <button class="resend-btn" id="resendBtn">Resend</button>
        </p>

        <a href="/register" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Back to Registration
        </a>
    </div>

    <script>
        const otpInputs  = document.querySelectorAll('.otp-input');
        const otpForm    = document.getElementById('otpForm');
        const submitBtn  = document.getElementById('submitBtn');
        const btnText    = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const resendBtn  = document.getElementById('resendBtn');

        const urlParams = new URLSearchParams(window.location.search);
        let verificationToken = urlParams.get('token');
        const email = urlParams.get('email');

        if (email) {
            document.getElementById('instructionText').textContent = `We've sent a 6-digit code to ${email}.`;
        }

        // OTP input navigation
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Strip any non-digit the browser let through
                e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1);
                if (e.target.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
                // Allow only digit keys, backspace, tab, arrow keys
                const allowed = ['Backspace','Tab','ArrowLeft','ArrowRight','Delete'];
                if (!allowed.includes(e.key) && !/^\d$/.test(e.key)) {
                    e.preventDefault();
                }
            });

            // Paste: intercept BEFORE maxlength truncates the value
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const raw    = (e.clipboardData || window.clipboardData).getData('text');
                const digits = raw.replace(/\D/g, '').split('').slice(0, otpInputs.length);
                if (!digits.length) return;

                // Fill inputs from the focused box onward, or from the start
                const start = index;
                digits.forEach((d, i) => {
                    const target = otpInputs[start + i];
                    if (target) target.value = d;
                });

                // Move focus to the box after the last filled one
                const nextIndex = Math.min(start + digits.length, otpInputs.length - 1);
                otpInputs[nextIndex].focus();
            });
        });

        function showError(msg) {
            errorAlert.textContent = msg;
            errorAlert.style.display = 'block';
            successAlert.style.display = 'none';
        }

        function showSuccess(msg) {
            successAlert.textContent = msg;
            successAlert.style.display = 'block';
            errorAlert.style.display = 'none';
        }

        function clearMessages() {
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
        }

        function setLoading(on) {
            submitBtn.disabled = on;
            btnText.style.display = on ? 'none' : 'inline';
            btnSpinner.style.display = on ? 'block' : 'none';
        }

        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const otp = Array.from(otpInputs).map(inp => inp.value).join('');
            if (otp.length !== 6) {
                showError('Please enter all 6 digits.');
                return;
            }

            if (!verificationToken) {
                showError('Verification session expired. Please try again.');
                return;
            }

            setLoading(true);

            try {
                const res = await fetch('/auth/verify-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: verificationToken, otp }),
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || 'Verification failed. Please try again.');
                }

                const isApp = urlParams.get('app') === 'flutter';
                
                if (isApp) {
                    showSuccess('Email verified successfully! You may now close this screen.');
                    setTimeout(() => { if (window.close) window.close(); }, 2000);
                } else {
                    showSuccess('Email verified successfully! Redirecting to login...');
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                }
            } catch (err) {
                showError(err.message);
                setLoading(false);
            }
        });

        resendBtn.addEventListener('click', async () => {
            if (resendBtn.classList.contains('disabled')) return;
            clearMessages();

            try {
                const res = await fetch('/auth/resend-verification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Failed to resend code.');

                verificationToken = data.verification_token;
                showSuccess('New verification code sent successfully.');

                // 60s cooldown
                resendBtn.classList.add('disabled');
                resendBtn.textContent = 'Resend in 60s';
                let seconds = 60;
                const interval = setInterval(() => {
                    seconds--;
                    resendBtn.textContent = `Resend in ${seconds}s`;
                    if (seconds <= 0) {
                        clearInterval(interval);
                        resendBtn.classList.remove('disabled');
                        resendBtn.textContent = 'Resend';
                    }
                }, 1000);
            } catch (err) {
                showError(err.message);
            }
        });
    </script>
</body>
</html>
