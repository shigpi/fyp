<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceScribe - Forgot Password</title>
    <meta name="description" content="Reset your VoiceScribe account password.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:         #000000;
            --card:       #171717;
            --border:     #262626;
            --text:       #FFFFFF;
            --muted:      #A3A3A3;
            --subtle:     #525252;
            --input-bg:   #171717;
            --btn-bg:     #FFFFFF;
            --btn-text:   #000000;
            --error:      #ef4444;
            --success:    #22c55e;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        /* Logo */
        .logo {
            width: 48px;
            height: 48px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .logo svg { width: 24px; height: 24px; fill: var(--text); }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; }
        .subtitle { font-size: 14px; color: var(--muted); margin: 0 0 32px; text-align: center; }

        /* Form */
        form { width: 100%; display: flex; flex-direction: column; gap: 10px; }

        input {
            width: 100%;
            padding: 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        input::placeholder { color: var(--muted); }
        input:focus { border-color: var(--subtle); }

        .btn {
            width: 100%;
            padding: 16px;
            margin-top: 4px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Loader spinner */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--btn-text);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Alert boxes */
        .alert {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
            text-align: center;
        }
        .alert-error   { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .alert-success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }

        /* Back link */
        .back-link {
            margin-top: 24px;
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-link:hover { color: var(--text); }

        /* Success state icon */
        .success-icon {
            display: none;
            width: 48px;
            height: 48px;
            background: rgba(34,197,94,0.12);
            border: 1px solid rgba(34,197,94,0.3);
            border-radius: 16px;
            margin-bottom: 16px;
            align-items: center;
            justify-content: center;
            animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        .success-icon svg { width: 24px; height: 24px; stroke: #86efac; fill: none; }
        @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </div>

        <!-- Default state -->
        <div id="defaultState" style="width:100%;display:flex;flex-direction:column;align-items:center;">
            <h1>Forgot Password?</h1>
            <p class="subtitle">Enter your email and we'll send you a reset link.</p>

            <div id="errorAlert" class="alert alert-error"></div>

            <form id="forgotForm">
                <input
                    type="email"
                    id="emailInput"
                    placeholder="Email address"
                    autocomplete="email"
                    required
                >
                <button type="submit" class="btn" id="submitBtn">
                    <span id="btnText">Send Reset Link</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </form>
        </div>

        <!-- Success state (shown after submit) -->
        <div id="successState" style="display:none;text-align:center;display:none;flex-direction:column;align-items:center;">
            <div class="success-icon" id="successIcon">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                    <polyline points="22,6 12,13 2,6"/>
                </svg>
            </div>
            <h1 style="font-size:20px;margin:0 0 8px;">Check your inbox</h1>
            <p class="subtitle" style="margin-bottom:16px;">
                If <strong id="sentEmail" style="color:var(--text);"></strong> is registered,
                a reset link has been sent. It expires in <strong style="color:var(--text);">20 minutes</strong>.
            </p>
            <p style="color:var(--subtle);font-size:13px;margin:0;">
                Didn't get it? Check your spam folder or
                <button id="retryBtn" style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;font-family:inherit;">
                    try again
                </button>.
            </p>
        </div>

        <a href="/login" class="back-link" id="backLink">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Back to Login
        </a>
    </div>

    <script>
        const form         = document.getElementById('forgotForm');
        const emailInput   = document.getElementById('emailInput');
        const submitBtn    = document.getElementById('submitBtn');
        const btnText      = document.getElementById('btnText');
        const btnSpinner   = document.getElementById('btnSpinner');
        const errorAlert   = document.getElementById('errorAlert');
        const defaultState = document.getElementById('defaultState');
        const successState = document.getElementById('successState');
        const successIcon  = document.getElementById('successIcon');
        const sentEmail    = document.getElementById('sentEmail');
        const retryBtn     = document.getElementById('retryBtn');

        function showError(msg) {
            errorAlert.textContent = msg;
            errorAlert.style.display = 'block';
        }

        function clearError() {
            errorAlert.style.display = 'none';
            errorAlert.textContent = '';
        }

        function setLoading(on) {
            submitBtn.disabled = on;
            btnText.style.display = on ? 'none' : 'inline';
            btnSpinner.style.display = on ? 'block' : 'none';
        }

        async function submitForgot(email) {
            clearError();
            setLoading(true);

            try {
                const res = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });

                // Always show success — backend never leaks email existence
                if (res.ok || res.status === 429) {
                    if (res.status === 429) {
                        showError('Too many requests. Please wait a moment before trying again.');
                        setLoading(false);
                        return;
                    }
                    // Transition to success state
                    sentEmail.textContent = email;
                    defaultState.style.display = 'none';
                    successState.style.display = 'flex';
                    successIcon.style.display = 'flex';
                } else {
                    const data = await res.json().catch(() => ({}));
                    showError(data.detail || 'Something went wrong. Please try again.');
                    setLoading(false);
                }
            } catch (_) {
                showError('Network error. Please check your connection and try again.');
                setLoading(false);
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            if (!email) { showError('Please enter your email address.'); return; }
            submitForgot(email);
        });

        retryBtn.addEventListener('click', () => {
            successState.style.display = 'none';
            defaultState.style.display = 'flex';
            defaultState.style.flexDirection = 'column';
            defaultState.style.alignItems = 'center';
            emailInput.value = '';
            clearError();
            setLoading(false);
        });
    </script>
</body>
</html>
