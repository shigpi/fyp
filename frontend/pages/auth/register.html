<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceScribe - Create Account</title>
    <!-- Use Google Fonts to replicate Flutter's default smooth typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --container-bg: #171717;
            --border-color: #262626;
            --text-primary: #FFFFFF;
            --text-secondary: #A3A3A3;
            --input-bg: #171717;
            --button-bg: #FFFFFF;
            --button-text: #000000;
            --error-color: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .logo {
            width: 48px;
            height: 48px;
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .logo svg {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            width: 100%;
        }

        input {
            width: 100%;
            padding: 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input::placeholder {
            color: var(--text-secondary);
        }

        input:focus {
            border-color: #525252;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:active {
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--error-color);
            font-size: 14px;
            margin-top: -4px;
            margin-bottom: 8px;
            display: none;
            text-align: center;
        }
        
        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--button-text);
            border-bottom-color: transparent;
            border-radius: 50%;
            margin: 0 auto;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </div>
        <h1>Create Account</h1>
        <p class="subtitle">Join VoiceScribe today</p>

        <div id="errorMessage" class="error-message"></div>

        <form id="registerForm">
            <div class="input-group">
                <input type="text" id="fullName" placeholder="Full Name" required>
            </div>
            <div class="input-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="tel" id="phone" placeholder="Phone Number (Optional)">
            </div>
            <div class="input-group">
                <input type="date" id="dob" placeholder="Date of Birth">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <div class="input-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>
            <button type="submit" id="submitBtn">
                <span id="btnText">Create Account</span>
                <div class="loader" id="btnLoader"></div>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const dob = document.getElementById('dob').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const errorEl = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // Validation
            if (password !== confirmPassword) {
                errorEl.textContent = 'Passwords do not match';
                errorEl.style.display = 'block';
                return;
            }

            errorEl.style.display = 'none';
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';

            try {
                // 1. Register User
                const registerPayload = {
                    email: email,
                    password: password,
                    full_name: fullName
                };
                if (phone) registerPayload.phone = phone;
                if (dob) registerPayload.dob = dob;

                const registerRes = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registerPayload)
                });

                if (!registerRes.ok) {
                    const data = await registerRes.json();
                    throw new Error(data.detail || 'Registration failed');
                }

                // 2. Auto Login to get JWT
                const loginRes = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                if (!loginRes.ok) {
                    throw new Error('Registration successful but login failed. Please login manually.');
                }

                const loginData = await loginRes.json();

                // 3. Post Message to Flutter App if running inside WebView
                if (window.AuthChannel) {
                    window.AuthChannel.postMessage(JSON.stringify(loginData));
                } else {
                    // Fallback for web usage
                    window.location.href = '/login'; 
                }

            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
