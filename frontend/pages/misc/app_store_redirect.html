<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceScribe - Download the App</title>
    <meta name="description" content="Download the VoiceScribe mobile app to access your transcriptions and settings.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #000000;
            --card:     #171717;
            --border:   #262626;
            --text:     #FFFFFF;
            --muted:    #A3A3A3;
            --subtle:   #525252;
            --btn-bg:   #FFFFFF;
            --btn-text: #000000;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo {
            width: 56px;
            height: 56px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .logo svg { width: 28px; height: 28px; fill: var(--text); }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin: 0 0 10px;
        }

        p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            margin: 0 0 32px;
        }

        .store-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .store-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--btn-bg);
            color: var(--btn-text);
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            transition: opacity 0.2s;
            border: none;
            cursor: pointer;
        }
        .store-btn:hover { opacity: 0.88; }
        .store-btn svg { flex-shrink: 0; }

        .store-btn-secondary {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }
        .store-btn-secondary:hover { border-color: var(--subtle); }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 24px 0;
        }

        .logout-link {
            font-size: 13px;
            color: var(--subtle);
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: color 0.2s;
            padding: 0;
        }
        .logout-link:hover { color: var(--muted); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </div>

        <h1>Download the Mobile App</h1>
        <p>You've successfully logged in. The web dashboard is reserved for team administrators. To access your transcriptions and settings, please download the VoiceScribe mobile app.</p>

        <div class="store-buttons">
            <a href="#" class="store-btn" id="appStoreBtn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                </svg>
                Download on the App Store
            </a>
            <a href="#" class="store-btn store-btn-secondary" id="playStoreBtn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3.18 23.76a2.5 2.5 0 0 0 2.64-.27l13.68-7.95-3.06-3.06zM.5 1.02A2.5 2.5 0 0 0 0 2.5v19a2.5 2.5 0 0 0 .5 1.48L13.41 12zM23.49 10.39l-3.1-1.8-3.44 3.41 3.44 3.44 3.13-1.82a2.5 2.5 0 0 0 0-3.23zM5.82.51 19.5 8.46l-3.06 3.06z"/>
                </svg>
                Get it on Google Play
            </a>
        </div>

        <div class="divider"></div>

        <button class="logout-link" onclick="logout()">Log out instead</button>
    </div>

    <script>
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
