<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceScribe - Download the App</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
        }

        .redirect-container {
            background-color: var(--sidebar-bg); /* Neutral 900 */
            border: 1px solid var(--border-color); /* Neutral 800 */
            padding: 3rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .redirect-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .redirect-container h1 {
            font-size: 1.5rem;
            color: var(--white);
            margin-bottom: 1rem;
        }

        .redirect-container p {
            color: var(--text-light); /* Neutral 400 */
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .store-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background-color: var(--white);
            color: var(--bg-color); /* Black */
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .store-btn:hover {
            opacity: 0.9;
        }

        .logout-link {
            display: block;
            margin-top: 2rem;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: var(--white);
        }
    </style>
</head>

<body>
    <div class="redirect-container">
        <div class="redirect-icon">📱</div>
        <h1>Download the Mobile App</h1>
        <p>You have successfully logged in. However, the web dashboard is reserved for team administrators. To access your transcriptions and settings, please download the VoiceScribe mobile app.</p>
        
        <div class="store-buttons">
            <a href="#" class="store-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
                Download on the App Store
            </a>
            <a href="#" class="store-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 20.5v-17c0-.83.67-1.5 1.5-1.5h15c.83 0 1.5.67 1.5 1.5v17c0 .83-.67 1.5-1.5 1.5h-15c-.83 0-1.5-.67-1.5-1.5zm16-17v14h-14v-14h14z"/></svg>
                Get it on Google Play
            </a>
        </div>

        <a href="#" onclick="logout(); return false;" class="logout-link">Log out instead</a>
    </div>

    <script>
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login';
        }
    </script>
</body>

</html>
