<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoiceScribe - Log In</title>
    <meta name="description" content="Log in to your VoiceScribe account.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #000000;
            --card:     #171717;
            --border:   #262626;
            --text:     #FFFFFF;
            --muted:    #A3A3A3;
            --subtle:   #525252;
            --input-bg: #171717;
            --btn-bg:   #FFFFFF;
            --btn-text: #000000;
            --error:    #ef4444;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top nav ── */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .nav-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-home:hover { color: var(--text); }
        .nav-home svg {
            width: 16px; height: 16px;
            stroke: currentColor; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            text-decoration: none;
        }
        .nav-brand-icon {
            width: 28px; height: 28px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-brand-icon svg { width: 15px; height: 15px; fill: var(--text); }

        /* ── Centered form area ── */
        .page-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo mark */
        .logo {
            width: 48px; height: 48px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
        }
        .logo svg { width: 24px; height: 24px; fill: var(--text); }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.02em; }
        .subtitle { font-size: 14px; color: var(--muted); margin: 0 0 32px; text-align: center; }

        /* Form */
        form { width: 100%; display: flex; flex-direction: column; gap: 10px; }

        .input-wrapper { position: relative; width: 100%; }

        input {
            width: 100%;
            padding: 15px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        input[type="password"] { padding-right: 48px; }
        input::placeholder { color: var(--muted); }
        input:focus { border-color: var(--subtle); }

        .eye-btn {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            background: none; border: none;
            cursor: pointer; padding: 4px;
            color: var(--muted);
            display: flex; align-items: center;
            transition: color 0.2s;
        }
        .eye-btn:hover { color: var(--text); }

        .forgot-row {
            text-align: right;
            width: 100%;
            margin-top: -2px;
        }
        .forgot-row a {
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-row a:hover { color: var(--text); }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 4px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .spinner {
            display: none;
            width: 18px; height: 18px;
            border: 2px solid var(--btn-text);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .alert {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
            text-align: center;
            margin-bottom: 4px;
        }
        .alert-error { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }

        .divider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin: 12px 0 4px;
        }
        .divider-row hr { flex: 1; border: none; border-top: 1px solid var(--border); margin: 0; }
        .divider-row span { font-size: 12px; color: var(--subtle); }

        .signup-row {
            margin-top: 8px;
            font-size: 14px;
            color: var(--muted);
            text-align: center;
        }
        .signup-row a {
            color: var(--text);
            font-weight: 600;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .signup-row a:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- Top nav -->
    <nav class="top-nav">
        <a href="/" class="nav-home">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            Back to Home
        </a>
        <a href="/" class="nav-brand">
            <div class="nav-brand-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </div>
            VoiceScribe
        </a>
    </nav>

    <!-- Centered form -->
    <div class="page-body">
        <div class="card">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </div>

            <h1>Welcome back</h1>
            <p class="subtitle">Log in to your VoiceScribe account</p>

            <div id="errorAlert" class="alert alert-error"></div>

            <form id="loginForm">
                <input
                    type="email"
                    id="email"
                    placeholder="Email address"
                    autocomplete="email"
                    required
                >
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="eye-btn" id="togglePassword" aria-label="Toggle password visibility">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="forgot-row">
                    <a href="/forgot-password">Forgot password?</a>
                </div>
                <button type="submit" class="btn" id="submitBtn">
                    <span id="btnText">Log In</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </form>

            <div class="divider-row"><hr><span>or</span><hr></div>
            <p class="signup-row">Don't have an account? <a href="/register">Sign up for free</a></p>
        </div>
    </div>

<script>
    const loginForm  = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn  = document.getElementById('submitBtn');
    const btnText    = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const pwInput    = document.getElementById('password');
    const toggleBtn  = document.getElementById('togglePassword');

    toggleBtn.addEventListener('click', () => {
        const show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        toggleBtn.style.color = show ? '#ffffff' : '';
    });

    function showError(msg) {
        errorAlert.textContent = msg;
        errorAlert.style.display = 'block';
    }
    function clearError() {
        errorAlert.style.display = 'none';
        errorAlert.textContent = '';
    }
    function setLoading(on) {
        submitBtn.disabled = on;
        btnText.style.display = on ? 'none' : 'inline';
        btnSpinner.style.display = on ? 'block' : 'none';
    }

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const email    = document.getElementById('email').value.trim();
        const password = pwInput.value;

        setLoading(true);

        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.detail || 'Login failed. Please check your credentials.');
            }

            localStorage.setItem('token', data.access_token);

            const role = data.user?.role;
            if (role === 'super_admin' || role === 'admin') {
                window.location.href = '/admin';
            } else {
                const orgsRes = await fetch('/users/me/organizations', {
                    headers: { 'Authorization': `Bearer ${data.access_token}` }
                });
                let isTeamAdmin = false;
                if (orgsRes.ok) {
                    const memberships = await orgsRes.json();
                    isTeamAdmin = memberships.some(m =>
                        m.organization && m.organization.type === 'team' &&
                        (m.role === 'owner' || m.role === 'admin')
                    );
                }
                window.location.href = isTeamAdmin ? '/organization' : '/app-store';
            }
        } catch (err) {
            showError(err.message);
            setLoading(false);
        }
    });
</script>
</body>
</html>
